[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insight-function-array"
version = "0.1.0"
description = "Detect simple BI insights in dataframe-shaped query results."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]

[project.optional-dependencies]
clustering = ["scikit-learn>=1.3"]
sql = ["sqlglot>=25"]
dev = ["pytest>=8"]
all = ["scikit-learn>=1.3", "sqlglot>=25", "pytest>=8",  "tabulate>=0.9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["insight_function_array*"]